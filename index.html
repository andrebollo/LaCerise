<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1220">
<title>La Cerise — Controle de Custos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🍒</span>
    <div>
      <h1>La Cerise</h1>
      <p id="topbar-sub">Controle de receitas e orçamentos</p>
    </div>
  </div>
  <button id="btn-menu" class="icon-btn" aria-label="Mais opções">⋮</button>
</header>

<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-tab="ingredientes">
    <span class="tab-icon">🧺</span><span>Ingredientes</span>
  </button>
  <button class="tab" data-tab="receitas">
    <span class="tab-icon">📖</span><span>Receitas</span>
  </button>
  <button class="tab" data-tab="resumo">
    <span class="tab-icon">📊</span><span>Resumo</span>
  </button>
  <button class="tab" data-tab="orcamentos">
    <span class="tab-icon">🧾</span><span>Orçamentos</span>
  </button>
  <button class="tab" data-tab="balanco">
    <span class="tab-icon">💰</span><span>Balanço</span>
  </button>
</nav>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="app.js"></script>
</body>
</html>
